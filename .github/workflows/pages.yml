name: pages

# 把 docs/ 和 install.sh 一起发布到 GitHub Pages，
# 这样安装地址可以短到 https://leafiy.github.io/rdev/install.sh
on:
  push:
    branches: [main]
    paths: [docs/**, install.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stage site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          cp install.sh _site/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
