name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      # 两个平台分别报告结果，避免一边失败把另一边标成 Cancelled。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # macOS 上用系统自带的 bash 3.2 跑，保证兼容
      RDEV_TEST_BASH: ${{ matrix.os == 'macos-latest' && '/bin/bash' || 'bash' }}
    steps:
      - uses: actions/checkout@v5
      - name: Syntax
        run: $RDEV_TEST_BASH tests/test_syntax.sh
      - name: Menu
        run: $RDEV_TEST_BASH tests/test_menu.sh
      - name: Setup / doctor / uninstall
        run: $RDEV_TEST_BASH tests/test_setup.sh
      - name: One-line installer
        run: $RDEV_TEST_BASH tests/test_install.sh
      - name: Real terminal restoration
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 2 \
            https://github.com/shell-pool/shpool/releases/download/v0.11.3/shpool-x86_64-unknown-linux-musl.tar.gz \
            -o "$RUNNER_TEMP/shpool.tar.gz"
          tar -xzf "$RUNNER_TEMP/shpool.tar.gz" -C "$RUNNER_TEMP"
          RDEV_TEST_SHPOOL="$RUNNER_TEMP/shpool" python3 tests/test_restore.py
