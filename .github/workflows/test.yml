name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Syntax
        run: ./tests/test_syntax.sh
      - name: CLI
        run: ./tests/test_cli.sh
      - name: Current-terminal connection
        run: ./tests/test_active_connection.sh
      - name: Workspace listing
        run: ./tests/test_session_listing.sh
      - name: Remote dtach auto-install
        run: ./tests/test_auto_install.sh
