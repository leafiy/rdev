set -g status on
set -g status-interval 5
set -g status-right-length 90
set -g status-right '#[fg=colour232]#($HOME/.cache/rdev/bin/rdev-token-status #{pane_pid})  ·  %Y-%m-%d %H:%M:%S '
set -g history-limit 100000
set -g focus-events on
set -g set-clipboard on
set -g window-status-separator ''
set -g window-status-format ' #I:#($HOME/.cache/rdev/bin/rdev-agent-name #{pane_pid}) '
set -g window-status-current-format ' #I:#($HOME/.cache/rdev/bin/rdev-agent-name #{pane_pid}) '
bind-key U if-shell -F '#{pane_in_mode}' 'send-keys -X -N 10 scroll-up' 'copy-mode -e ; send-keys -X -N 10 scroll-up'
bind-key D if-shell -F '#{pane_in_mode}' 'send-keys -X -N 10 scroll-down' 'select-pane -t='
bind-key -n MouseDrag1Pane if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -M'
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -n MouseDown3Pane display-menu -T '远程 tmux' -x M -y M \
  '上一个窗口' p 'previous-window' \
  '下一个窗口' n 'next-window' \
  '新建窗口' c 'new-window' \
  '左右分屏' '%' 'split-window -h' \
  '上下分屏' '"' 'split-window -v' \
  '断开并保留' d 'detach-client' \
  '关闭当前窗格' x 'confirm-before -p "关闭当前窗格？(y/n)" kill-pane'
